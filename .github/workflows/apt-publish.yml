# Publishes the signed apt repository, https://mbarc.github.io/nectra/apt, to
# GitHub Pages from the debs release.yml attached to the v* releases. Design:
# docs/design/APT-REPO.md.
#
# workflow_dispatch only, from master, in the `apt-publish` environment, which
# holds the signing key and needs Michael's approval for each run. A tag-push
# trigger would run the workflow file as it is at the tag, so a pushed tag never
# reaches the key. Third-party actions are pinned by commit.
#
# Stateless: every run rebuilds both suites from scratch.
#   stable  the last 3 v* releases
#   alpha   those, plus the last 3 v* prereleases
# A release whose title or notes contain [yanked] is skipped; a release must be
# on master and every deb must match the .sha256 next to it, or nothing is published.
name: apt-publish
on: workflow_dispatch
permissions: {}
concurrency: apt-publish
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: apt-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.tagName | startswith("v")) | "\(.isPrerelease) \(.tagName)"' > releases
          # Stable first: a deb that is in both (the same nectra-laya) goes to stable.
          for suite in stable alpha; do
            [ $suite = stable ] && want=false || want=true
            n=0
            while read -r pre tag <&3; do
              [ "$pre" = $want ] && [ $n -lt 3 ] || continue
              # Captured first: grep -q exiting early would fail the pipe under pipefail.
              notes=$(gh release view "$tag" --json name,body --jq '.name + " " + .body')
              if grep -qF '[yanked]' <<< "$notes"; then
                echo "skipping $tag: [yanked]"; continue
              fi
              if [ "$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith(".deb"))] | length')" = 0 ]; then
                echo "skipping $tag: no debs"; continue
              fi
              git merge-base --is-ancestor "$tag" origin/master || { echo "$tag is not on master"; exit 1; }
              n=$((n + 1))
              gh release download "$tag" --pattern '*.deb' --pattern '*.deb.sha256' --dir "dl/$tag"
              (cd "dl/$tag" && sha256sum --check --strict -- *.deb.sha256)
              mkdir -p "debs/$suite"
              for deb in "dl/$tag"/*.deb; do
                f=${deb##*/}
                [ -e "debs/stable/$f" ] || [ -e "debs/alpha/$f" ] || cp "$deb" "debs/$suite/"
              done
            done 3< releases
          done
          find debs -name '*.deb' | sort
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          export GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          printf %s "$APT_SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
          export APT_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          # Only a key that nectra ships in its keyring may sign.
          shipped=$(gpg --show-keys --with-colons packaging/nectra-archive-keyring.gpg)
          grep -qF ":$APT_KEY:" <<< "$shipped" \
            || { echo "signing key $APT_KEY is not in packaging/nectra-archive-keyring.gpg"; exit 1; }
          APT_PASSPHRASE_FILE=$GNUPGHOME/passphrase bash packaging/build-apt-repo.sh debs site/apt
          cp packaging/nectra-archive-keyring.gpg packaging/nectra.sources site/apt/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
