name: ci
# CI runs on builder (the merge gate); GitHub Actions is for releases only.
# Run this by hand from the Actions tab when wanted.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo run --locked -- eval eval/tasks.json
      - run: cargo build --release --locked
      - if: runner.os == 'Windows'
        run: ./scripts/test-uninstall.ps1
      - if: runner.os != 'Windows'
        run: sh scripts/test-uninstall.sh
  audit:
    # RustSec advisories for the locked dependency tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit@0.23.0
      - run: cargo audit --deny warnings
  deny:
    # Licenses, bans, advisories and sources, as configured in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check
  windows-gnu-wine:
    # The x86_64-pc-windows-gnu build, run for real under wine: the test
    # binaries and the release binary. (The Windows MSVC build is the `test`
    # job above; this one covers the gnu target the release also ships.)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 wine wine64
          command -v wine
          wineboot --init || true
      # These tests need a real Windows: an administrator-owned C:\, a real
      # PowerShell for junctions, ConPTY and job objects. Wine has none of them
      # (wine's C:\ is the runner's own; the pty fixture's descendant is never
      # seen), so they are skipped here; the windows-latest `test` job runs them.
      - run: >-
          cargo test --locked --target x86_64-pc-windows-gnu --all-targets --
          --skip knowledge::tests::a_file_its_user_can_write_is_refused
          --skip skills::tests::linking_makes_every_user_skill_visible_to_every_cli
          --skip skills::tests::a_skill_name_is_never_run_as_a_command
          --skip executor::tests::windows_output_until_resumes_a_job_owned_child
          --skip native_terminal_animation_approval_resize_and_context_handoff
          --skip completed_reply_returns_without_any_exit_keystroke
          --skip cancelling_native_work_does_not_save_a_fake_answer
          --skip undersized_resize_keeps_provider_work_alive
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Run the release binary under wine
        run: wine target/x86_64-pc-windows-gnu/release/nectra.exe --version
