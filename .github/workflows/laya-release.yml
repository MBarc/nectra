# Publishes a retrained Laya model and opens the PR that pins it in src/laya.rs.
#
# How a retrain reaches CI: tools/laya/retrain needs the generator CLI, ssh to a
# training host and an hour of CPU, so it runs on a machine of yours, not here.
# Upload its output as a *staging* release named laya-staging-N, every asset
# under the name src/laya.rs downloads (see tools/laya/README.md, "Publishing"):
#   gh release create laya-staging-N --prerelease --title "Laya staging N" <assets...>
# Then run this workflow with model_tag laya-model-N. It gates the model on a
# held-out set, opens the pin-update PR, and only then creates the laya-model-N
# release from the staged files with scripts/release-laya.sh. Needs
# Settings > Actions > "Allow GitHub Actions to create pull requests".
#
# workflow_dispatch only: a tag-push trigger would run the workflow file as it
# is at the tagged commit, so anyone who can push a tag could run modified
# steps with write permissions. Third-party actions are pinned by commit, and
# GH_TOKEN is set only on the steps that call gh or git push, so the toolchain
# action and every build.rs run without it.
name: laya-release
on:
  workflow_dispatch:
    inputs:
      model_tag:
        description: Release to create, laya-model-N (assets come from laya-staging-N)
        required: true
      eval_set:
        description: Held-out set in eval/laya/
        default: fresh-test-3.json
      min_accuracy:
        description: Accuracy floor, on top of the current model's (0 = current model only)
        default: "0"
permissions: {}
env:
  TAG: ${{ inputs.model_tag }}
jobs:
  release:
    runs-on: ubuntu-latest
    # Permissions are per job; the token reaches only the steps that set GH_TOKEN.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR is cut from the default branch, whatever branch the run was started on.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned by commit, the action can't read the toolchain from its ref.
          toolchain: stable
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^laya-model-[0-9]+(-alpha\.[0-9]+)?$ ]] || { echo "TAG must be laya-model-N[-alpha.M], got $TAG"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released"; exit 1; fi
      - name: Fetch the staged model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "laya-staging-${TAG#laya-model-}" --pattern "*" --dir stage
          (cd stage && sha256sum -- * > ../SHA256SUMS)
      - name: Pin the staged files
        run: python3 scripts/update_laya_pins.py "$TAG" SHA256SUMS
      - run: cargo build --release --locked
      - name: Pins and package metadata agree
        # Before the PR and the release: the deb's Breaks must name this model.
        run: cargo test --release --locked --lib laya::tests::nectra_deb_breaks_older_models
      - name: Eval gate
        env:
          EVAL_SET: ${{ inputs.eval_set || 'fresh-test-3.json' }}
          FLOOR: ${{ inputs.min_accuracy || '0' }}
        run: python3 scripts/laya_gate.py stage --set "$EVAL_SET" --floor "$FLOOR" --out gate.json
      - name: Open the pin-update PR
        # Before the release, so a failure here publishes nothing. A re-run
        # force-pushes laya-pins-N and refreshes the PR it already opened.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > pr-body.md
          import json
          g = json.load(open("gate.json"))
          print(f"Pins `src/laya.rs` at the new `{__import__('os').environ['TAG']}` release.\n")
          print(f"Eval gate, `{g['set']}`: **{g['passed']}/{g['total']} = {g['accuracy']:.2%}**")
          print(f"(required {g['required']:.2%}: current model {g['current_model']:.2%}, floor {g['floor']:.2%}).\n")
          d, c = g["demanding_model"], g["tier_current_model"]
          print(f"Difficulty, `{g['tier_set']}`: tier accuracy **{g['tier_accuracy']:.2%}** (current {c['accuracy']:.2%});")
          print(f"router demanding TP/FP/FN **{d['tp']}/{d['fp']}/{d['fn']}** (current {c['demanding_model']['tp']}/{c['demanding_model']['fp']}/{c['demanding_model']['fn']}); keyword fallbacks {g['keyword_fallbacks']}.\n")
          print("Review the model card and the release assets, then merge.")
          PY
          branch="laya-pins-${TAG#laya-model-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Pin $TAG in src/laya.rs"
          gh auth setup-git
          git push --force origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file pr-body.md
          else
            gh pr create --title "Pin $TAG" --body-file pr-body.md --base "${{ github.event.repository.default_branch }}" --head "$branch"
          fi
      - name: Create the release
        # Checks every file against the new pins, then gh release create with SHA256SUMS.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-laya.sh stage stage "$TAG" release-assets
