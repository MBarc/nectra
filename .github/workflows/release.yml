name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo run --locked -- eval eval/tasks.json
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: ./scripts/test-uninstall.ps1
      - if: runner.os != 'Windows'
        run: sh scripts/test-uninstall.sh
      - shell: bash
        run: |
          mkdir dist
          cp README.md LICENSE dist/
          cp -r docs dist/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/nectra.exe" dist/
            cp scripts/uninstall-nectra.ps1 dist/
            (cd dist && 7z a "../nectra-${{ matrix.target }}.zip" nectra.exe README.md LICENSE docs uninstall-nectra.ps1)
          else
            cp "target/${{ matrix.target }}/release/nectra" dist/
            cp scripts/uninstall-nectra.sh dist/
            tar -C dist -czf "nectra-${{ matrix.target }}.tar.gz" nectra README.md LICENSE docs uninstall-nectra.sh
          fi
      - shell: python
        run: |
          import hashlib, pathlib
          name = "nectra-${{ matrix.target }}.${{ matrix.ext }}"
          digest = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          pathlib.Path(name + ".sha256").write_text(digest + "  " + name + "\n")
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nectra-${{ matrix.target }}.${{ matrix.ext }}
            nectra-${{ matrix.target }}.${{ matrix.ext }}.sha256
