name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned by commit, the action can't read the toolchain from its ref.
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo run --locked -- eval eval/tasks.json
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: ./scripts/test-uninstall.ps1
      - if: runner.os != 'Windows'
        run: sh scripts/test-uninstall.sh
      - shell: bash
        run: |
          mkdir dist
          cp README.md LICENSE dist/
          cp -r docs config dist/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/nectra.exe" dist/
            cp scripts/uninstall-nectra.ps1 dist/
            (cd dist && 7z a "../nectra-${{ matrix.target }}.zip" nectra.exe README.md LICENSE docs config uninstall-nectra.ps1)
          else
            cp "target/${{ matrix.target }}/release/nectra" dist/
            cp scripts/uninstall-nectra.sh dist/
            tar -C dist -czf "nectra-${{ matrix.target }}.tar.gz" nectra README.md LICENSE docs config uninstall-nectra.sh
          fi
      # The apt packages: nectra, and nectra-laya for the model it pins. Only
      # apt-publish.yml signs and publishes them, from master.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb --no-build --target ${{ matrix.target }} --output .
          bash packaging/build-laya-deb.sh .
      - shell: python
        run: |
          import hashlib, pathlib
          for path in [pathlib.Path("nectra-${{ matrix.target }}.${{ matrix.ext }}"), *pathlib.Path().glob("*.deb")]:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              pathlib.Path(path.name + ".sha256").write_text(digest + "  " + path.name + "\n")
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # v0.5.0-alpha.1 and the like are prereleases: the apt `alpha` suite only.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            nectra-${{ matrix.target }}.${{ matrix.ext }}
            nectra-${{ matrix.target }}.${{ matrix.ext }}.sha256
            *.deb
            *.deb.sha256
