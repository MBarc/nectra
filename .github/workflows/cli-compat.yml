name: cli-compat
# Provider CLIs ship often and Nectra relies on their flags, settings files and
# terminal behaviour. Run this by hand against their latest releases; it no
# longer runs on a schedule (GitHub Actions is for releases only).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Live turns run only when these secrets are set; a few cents a day.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - name: Install the latest provider CLIs
        shell: bash
        run: |
          npm install -g @openai/codex@latest
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "irm https://claude.ai/install.ps1 | iex"
            echo "$USERPROFILE\\.local\\bin" >> "$GITHUB_PATH"
            pip install pyte pywinpty
          else
            curl -fsSL https://claude.ai/install.sh | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            pip install pyte
          fi
      - name: Sign the CLIs in with API keys
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash
        run: |
          printenv OPENAI_API_KEY | codex login --with-api-key
          python scripts/compat/ci_auth.py
      - name: Check Nectra against them
        shell: bash
        run: |
          live=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then live="--live"; fi
          exe=target/release/nectra
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          python scripts/compat/check.py --nectra "$exe" --providers anthropic,openai $live
