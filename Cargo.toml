[package]
name = "nectra"
version = "0.4.5"
edition = "2021"
rust-version = "1.89"
description = "Local conversation router for Claude Code, Codex, Gemini CLI, and Ollama"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anstream = "1"
crossterm = "0.28"
portable-pty = "0.9"
vt100 = "0.15"
unicode-segmentation = "1.12"
unicode-width = "0.2"
ctrlc = "~3.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
laya = { package = "laya-onnx", git = "https://github.com/NandhaKishorM/laya", rev = "d74e8be46ef5241e4ba2b16cd25e896f24f71373", default-features = false }
# ponytail: pinned; laya-onnx breaks on rc.14. load-dynamic: the runtime library comes with the model download.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "ndarray"] }
sha2 = "0.10"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "stream_process"
path = "tests/stream_process.rs"
harness = false

