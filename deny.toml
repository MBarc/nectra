# cargo deny check: run in CI (.github/workflows/ci.yml, job `deny`).

[graph]
# The shipped targets; keeps platform-only crates the other targets never build
# out of the license and ban checks.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# RustSec advisories. paste is unmaintained and has no fix: it is a compile-time
# proc macro reached only through tokenizers -> vendor/laya-onnx, so it is not
# in any runtime path. Same entry as .cargo/audit.toml.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, no fix; compile-time macro only, via tokenizers" },
]

[licenses]
# Everything in the current tree is permissive; this is that list. A new
# license has to be added here on purpose.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  # webpki-roots, webpki-root-certs: the Mozilla root list.
  "CDLA-Permissive-2.0",
  # option-ext (via dirs): file-level copyleft, used unmodified as a library.
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn" # the tree carries a few duplicates (rustix, syn, base64, ...)
wildcards = "deny"
allow-wildcard-paths = true # path dependencies inside this repository (vendor/)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
