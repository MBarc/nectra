# Claude's top tier (claude --help lists it). It claims `demanding` beside
# gpt-6-astra, so hard work still reaches a frontier model when only Claude is
# set up; with both, the scores below (above Opus on reasoning, below it on
# speed and cost) pick between them.
[[model]]
id = "fable"
provider = "anthropic"
runtime = "claude"
enabled = true
effort = ""
prefers = ["demanding"]
[model.capabilities]
coding=0.98
reasoning=1.0
long_context=0.99
writing=0.99
tool_use=0.99
speed=0.45
cost_efficiency=0.38

# `codex debug models`, 2026-10-26: gpt-6.1-sol is the current workhorse
