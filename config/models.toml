# Google models run through the Antigravity CLI (`agy`; Gemini CLI no longer
# signs in personal accounts). Only routed to when `google` is a selected provider.
# The ids are what `agy models` lists; the suffix is the thinking level.
# Capability scores are UNMEASURED placeholders carried over from the old
# gemini-2.5 entries (high = the 2.5-pro scores, medium/low = the 2.5-flash
# ones); calibration replaces them.
[[model]]
id = "gemini-3.8-flash-high"
provider = "google"
runtime = "agy"
enabled = true
effort = ""
prefers = []
[model.capabilities]
