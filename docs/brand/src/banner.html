<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1600px; height: 420px; }
  .wrap { position: relative; height: 100%; padding: 0 80px; display: flex; align-items: center; }
  .id { display: flex; align-items: center; gap: 34px; }
  .id img { width: 150px; height: 150px; }
  .wordmark { font-size: 132px; }
  .tagline { font-size: 31px; margin-top: 18px; max-width: 560px; line-height: 1.25; }
  .routes { position: absolute; left: 905px; top: 0; width: 615px; height: 420px; }
  .routes svg { position: absolute; inset: 0; }
  .msg { position: absolute; left: 0; top: 183px; font-size: 19px; padding: 14px 18px; border-radius: 14px 14px 14px 4px; background: var(--card); border: 2px solid var(--line); width: 240px; line-height: 1.3; }
  .chip { position: absolute; left: 400px; font-size: 22px; padding: 10px 20px 10px 16px; }
</style></head>
<body><script>if (location.hash === "#dark") document.body.classList.add("dark")</script>
<div class="wrap">
  <div class="id">
    <img src="../logo.svg" alt="">
    <div>
      <div class="wordmark">Nectra</div>
      <div class="tagline">One chat for every AI model you have. Each message goes to the one that should answer it.</div>
    </div>
  </div>
  <div class="routes">
    <svg viewBox="0 0 615 420" fill="none" stroke-linecap="round">
      <path d="M244 210h56" stroke="#E3A21A" stroke-width="5"/>
      <path d="M300 210C350 210 350 70 400 70" stroke="#8B5CF6" stroke-width="3" opacity=".45"/>
      <path d="M300 210C350 210 350 163 400 163" stroke="#10A37F" stroke-width="6"/>
      <path d="M300 210C350 210 350 257 400 257" stroke="#4285F4" stroke-width="3" opacity=".45"/>
      <path d="M300 210C350 210 350 350 400 350" stroke="#14B8A6" stroke-width="3" opacity=".45"/>
      <circle cx="300" cy="210" r="8" fill="#E3A21A"/>
    </svg>
    <div class="msg">debug this race condition in the scheduler</div>
    <div class="chip" style="--c:var(--claude); top:47px"><i></i>Claude Code</div>
    <div class="chip lit" style="--c:var(--openai); top:140px"><i></i>Codex</div>
    <div class="chip" style="--c:var(--gemini); top:234px"><i></i>Gemini CLI</div>
    <div class="chip" style="--c:var(--ollama); top:327px"><i></i>Ollama</div>
  </div>
</div>
</body></html>
