<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1280px; height: 640px; }
  .wrap { height: 100%; padding: 0 96px; display: flex; flex-direction: column; justify-content: center; }
  .id { display: flex; align-items: center; gap: 30px; }
  .id img { width: 132px; height: 132px; }
  .wordmark { font-size: 124px; }
  .tagline { font-size: 40px; margin: 40px 0 46px; max-width: 980px; line-height: 1.2; color: var(--ink); font-weight: 600; letter-spacing: -0.02em; }
  .chips { display: flex; gap: 16px; }
  .chip { font-size: 24px; padding: 10px 22px 10px 18px; }
  .sub { color: var(--muted); font-size: 24px; margin-top: 28px; }
</style></head>
<body><script>if (location.hash === "#dark") document.body.classList.add("dark")</script>
<div class="wrap">
  <div class="id"><img src="../logo.svg" alt=""><div class="wordmark">Nectra</div></div>
  <div class="tagline">One chat for every AI model you have. Each message goes to the one that should answer it.</div>
  <div class="chips">
    <div class="chip" style="--c:var(--claude)"><i></i>Claude Code</div>
    <div class="chip lit" style="--c:var(--openai)"><i></i>Codex</div>
    <div class="chip" style="--c:var(--gemini)"><i></i>Gemini CLI</div>
    <div class="chip" style="--c:var(--ollama)"><i></i>Ollama</div>
  </div>
  <div class="sub">Open source Rust CLI. Easy prompts go to cheaper models.</div>
</div>
</body></html>
